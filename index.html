<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adoresa Container Builder</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="topbar">
    <span class="logo">🧱 Adoresa Builder</span>
  </header>

  <main class="main">

    <div id="messagesContainer"></div>

    <button class="btn-add-message" onclick="addMessage()">
      <span>💬</span> Add Message
    </button>

    <div class="section" style="margin-top:20px">
      <h2>Send to Channel</h2>
      <input type="password" id="password" placeholder="Password">
      <select id="channelSelect" style="margin-top:8px">
        <option value="">Enter password first</option>
      </select>
      <button class="btn-success" id="sendBtn" style="margin-top:8px" onclick="sendToDiscord()">
        📤 Send to Discord
      </button>
      <p id="sendStatus" class="status"></p>
    </div>

    <div class="section">
      <h2>JSON Output</h2>
      <textarea id="jsonOutput" readonly rows="10"></textarea>
      <button class="btn-secondary" onclick="copyJson()">📋 Copy JSON</button>
      <p id="copyStatus" class="status"></p>
    </div>

  </main>

  <script src="app.js"></script>
</body>
</html>
